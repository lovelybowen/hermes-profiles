name: 角色配置检查
on:
  pull_request:
    paths:
      - 'profiles/**'
      - 'skills/**'
      - 'scripts/**'
      - '.github/workflows/profile-checks.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: pip install pyyaml

      - name: 校验角色元数据 / manifest / 技能副本一致性
        run: python3 scripts/validate_profiles.py

      - name: 检查 README.md 是否反映当前角色和技能
        run: |
          errors=0
          for p in profiles/*/; do
            name=$(basename "$p")
            if ! grep -q "$name" README.md; then
              echo "README.md 未提及角色 $name"
              errors=$((errors + 1))
            fi
          done
          for sk in $(find skills -name SKILL.md | xargs -n1 dirname | xargs -n1 basename | sort -u); do
            if ! grep -q "$sk" README.md; then
              echo "README.md 未提及技能 $sk"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "请更新 README.md，使其反映当前角色和技能"
            exit 1
          fi
          echo "README.md 已覆盖全部 $(ls profiles/ | wc -l | tr -d ' ') 个角色和 $(find skills -name SKILL.md | xargs -n1 dirname | xargs -n1 basename | sort -u | wc -l) 个技能"
